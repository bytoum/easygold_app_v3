name: easygold_app_v3
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^9.3.0
  injectable: ^3.0.0
  shared_preferences: ^2.5.5
  go_router: ^18.0.2
  equatable: ^3.0.0
  dartz: ^0.10.1
  dio: ^5.11.1
  retrofit: ^4.10.0
  logger: ^2.8.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.3
  build_runner: ^2.16.1
  retrofit_generator: ^10.2.11
  json_serializable: ^6.14.1
